<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📊 Survey Admin Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0f1117; --card: #1a1d27; --accent: #7c5cfc; --accent-light: #9b82fc;
  --accent-glow: rgba(124,92,252,0.25); --green: #34d399; --amber: #fbbf24;
  --text: #e4e4e7; --text-dim: #9ca3af; --border: #2a2d3a; --danger: #f87171;
}
body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

.bg-glow { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
.bg-glow::before { content:''; position:absolute; width:600px; height:600px; border-radius:50%; filter:blur(120px); opacity:0.1; background:var(--accent); top:-200px; right:-100px; }

.container { position: relative; z-index: 1; max-width: 1200px; margin: 0 auto; padding: 30px 24px; }

/* Header */
.header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px; margin-bottom: 32px; }
.header h1 { font-size: 28px; font-weight: 800; color: #fff; display: flex; align-items: center; gap: 12px; }
.header-actions { display: flex; gap: 10px; flex-wrap: wrap; }

.btn {
  padding: 10px 20px; border-radius: 10px; font-size: 14px; font-weight: 600; border: none;
  cursor: pointer; font-family: inherit; display: inline-flex; align-items: center; gap: 8px;
  transition: all 0.2s;
}
.btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent-light)); color: #fff; }
.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 16px var(--accent-glow); }
.btn-outline { background: transparent; color: var(--text); border: 1px solid var(--border); }
.btn-outline:hover { background: rgba(255,255,255,0.06); }
.btn-danger { background: rgba(248,113,113,0.15); color: var(--danger); border: 1px solid rgba(248,113,113,0.3); }
.btn-danger:hover { background: rgba(248,113,113,0.25); }
.btn-green { background: rgba(52,211,153,0.15); color: var(--green); border: 1px solid rgba(52,211,153,0.3); }
.btn-green:hover { background: rgba(52,211,153,0.25); }

/* Stats row */
.stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 32px; }
.stat-card {
  background: var(--card); border: 1px solid var(--border); border-radius: 14px;
  padding: 24px; text-align: center;
}
.stat-num { font-size: 42px; font-weight: 800; background: linear-gradient(135deg, #fff, var(--accent-light)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.stat-label { font-size: 13px; color: var(--text-dim); margin-top: 4px; font-weight: 500; }

/* Tabs */
.tabs { display: flex; gap: 4px; margin-bottom: 24px; background: var(--card); border-radius: 12px; padding: 4px; border: 1px solid var(--border); width: fit-content; }
.tab {
  padding: 10px 20px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer;
  color: var(--text-dim); transition: all 0.2s; border: none; background: none; font-family: inherit;
}
.tab.active { background: var(--accent); color: #fff; }
.tab:hover:not(.active) { color: var(--text); }

/* Table */
.table-wrapper {
  background: var(--card); border: 1px solid var(--border); border-radius: 14px;
  overflow: hidden; margin-bottom: 24px;
}
.table-scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th {
  background: rgba(124,92,252,0.1); padding: 14px 16px; text-align: left; font-weight: 600;
  color: var(--accent-light); white-space: nowrap; border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 2;
}
td {
  padding: 12px 16px; border-bottom: 1px solid rgba(42,45,58,0.5); color: var(--text);
  max-width: 250px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
td.wrap { white-space: normal; max-width: 300px; }
tr:hover td { background: rgba(124,92,252,0.04); }
tr:last-child td { border-bottom: none; }

/* Charts panel */
.charts-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 20px; margin-bottom: 24px; }
.chart-card {
  background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 24px;
}
.chart-card h3 { font-size: 15px; font-weight: 700; color: #fff; margin-bottom: 16px; }
.bar-row { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.bar-label { font-size: 12px; color: var(--text-dim); min-width: 120px; text-align: right; }
.bar-track { flex: 1; height: 24px; background: rgba(255,255,255,0.04); border-radius: 6px; overflow: hidden; position: relative; }
.bar-fill { height: 100%; border-radius: 6px; display: flex; align-items: center; padding-left: 8px; font-size: 11px; font-weight: 600; color: #fff; min-width: 28px; transition: width 0.6s ease; }
.bar-count { font-size: 12px; color: var(--text-dim); min-width: 30px; }

/* Detail modal */
.modal-overlay {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 100;
  align-items: center; justify-content: center; padding: 20px;
}
.modal-overlay.active { display: flex; }
.modal {
  background: var(--card); border: 1px solid var(--border); border-radius: 16px;
  max-width: 600px; width: 100%; max-height: 80vh; overflow-y: auto; padding: 32px;
}
.modal h2 { font-size: 20px; font-weight: 700; color: #fff; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
.modal-close { background: none; border: none; color: var(--text-dim); font-size: 24px; cursor: pointer; }
.modal-row { padding: 10px 0; border-bottom: 1px solid rgba(42,45,58,0.5); }
.modal-row:last-child { border-bottom: none; }
.modal-key { font-size: 12px; color: var(--accent-light); font-weight: 600; margin-bottom: 4px; }
.modal-val { font-size: 14px; color: var(--text); }

/* Empty state */
.empty-state { text-align: center; padding: 80px 24px; }
.empty-state .icon { font-size: 64px; margin-bottom: 16px; }
.empty-state h2 { font-size: 22px; color: #fff; margin-bottom: 8px; }
.empty-state p { color: var(--text-dim); font-size: 14px; }

/* Search */
.search-bar {
  background: rgba(255,255,255,0.04); border: 1px solid var(--border); border-radius: 10px;
  padding: 10px 16px; font-size: 14px; color: var(--text); font-family: inherit; outline: none;
  width: 100%; max-width: 300px; transition: border-color 0.3s;
}
.search-bar:focus { border-color: var(--accent); }
.search-bar::placeholder { color: var(--text-dim); }

.toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }

@media (max-width: 600px) {
  .container { padding: 16px 12px; }
  .stats-row { grid-template-columns: 1fr 1fr; }
  .charts-grid { grid-template-columns: 1fr; }
  .header h1 { font-size: 22px; }
}
</style>
</head>
<body>
<div class="bg-glow"></div>

<!-- Detail Modal -->
<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modalContent"></div>
</div>

<div class="container">
  <div class="header">
    <h1>📊 Survey Responses</h1>
    <div class="header-actions">
      <button class="btn btn-primary" onclick="syncWithGoogleSheet()" id="syncBtn">🔄 Refresh from Sheet</button>
      <button class="btn btn-green" onclick="importCSV()">📂 Import CSV</button>
      <button class="btn btn-outline" onclick="exportCSV()">📥 Export CSV</button>
      <button class="btn btn-danger" onclick="clearAll()">🗑 Clear Local</button>
    </div>
  </div>

  <!-- Stats -->
  <div class="stats-row" id="statsRow"></div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab active" onclick="switchTab('table', this)">📋 All Responses</button>
    <button class="tab" onclick="switchTab('charts', this)">📊 Charts</button>
  </div>

  <!-- Table View -->
  <div id="tableView">
    <div class="toolbar">
      <input class="search-bar" type="text" placeholder="🔍 Search by name, city..." oninput="filterTable(this.value)" id="searchInput">
      <span style="font-size:13px; color:var(--text-dim)" id="countLabel"></span>
    </div>
    <div class="table-wrapper">
      <div class="table-scroll">
        <table id="responseTable">
          <thead id="tableHead"></thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Charts View -->
  <div id="chartsView" style="display:none">
    <div class="charts-grid" id="chartsGrid"></div>
  </div>

  <!-- Empty State -->
  <div class="empty-state" id="emptyState" style="display:none">
    <div class="icon">📭</div>
    <h2>Koi response abhi nahi hai</h2>
    <p>Jab log survey fill karein ge, responses yahan dikhai dein gi.<br>Ya CSV file import karein.</p>
  </div>
</div>

<input type="file" id="csvFileInput" accept=".csv" style="display:none" onchange="handleCSVImport(event)">

<script>
const GOOGLE_SHEET_URL = 'https://script.google.com/macros/s/AKfycbyoW6fF2-7Ygb6VGAbPW7KMURUJ0shfQOYh2Pl7X2SY4JEfDSlPYpxRAE_eBX-thOv2QQ/exec';
const COLORS = ['#7c5cfc','#34d399','#fbbf24','#f87171','#06b6d4','#a78bfa','#fb923c','#f472b6','#4ade80','#38bdf8'];

const CHART_FIELDS = {
  'Experience': 'Kitne saal se ride?',
  'Frequency': 'Kitni baar ride?',
  'Saddle Type': 'Saddle ka type',
  'Saddle Source': 'Saddle kahan se?',
  'Saddle Movement': 'Saddle hilta hai?',
  'Discomfort': 'Takleef hoti hai?',
  'Repair History': 'Marammat karwai?',
  'Replaceable Parts': 'Replaceable parts pasand?',
};

const MULTI_CHART_FIELDS = {
  'Role': 'Rider ka role',
  'Top 3 Priorities': 'Top 3 priorities',
  'Discomfort Area': 'Takleef kahan?',
  'Weather Effects': 'Mausam ka asar',
  'Padding': 'Saddle ke neeche kya?',
};

let allData = [];
let filteredData = [];

function loadData() {
  allData = JSON.parse(localStorage.getItem('saddle_survey_responses') || '[]');
  filteredData = [...allData];
  render();
}

function render() {
  if (allData.length === 0) {
    document.getElementById('emptyState').style.display = 'block';
    document.getElementById('tableView').style.display = 'none';
    document.getElementById('statsRow').innerHTML = '';
    return;
  }
  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('tableView').style.display = 'block';
  renderStats();
  renderTable();
  renderCharts();
}

function renderStats() {
  const total = allData.length;
  const cities = new Set(allData.map(d => (d.City||'').toLowerCase()).filter(Boolean)).size;
  const todayStr = new Date().toLocaleDateString('en-PK');
  const today = allData.filter(d => (d.Timestamp||'').includes(todayStr)).length;

  // Avg discomfort
  const discomfortMap = { 'Kabhi nahi': 0, 'Kam': 1, 'Kabhi kabhi': 2, 'Aksar': 3, 'Har baar': 4 };
  const dVals = allData.map(d => discomfortMap[d.Discomfort]).filter(v => v !== undefined);
  const avgD = dVals.length ? (dVals.reduce((a,b) => a+b, 0) / dVals.length).toFixed(1) : '—';
  const dLabels = ['None','Low','Med','High','V.High'];
  const avgDLabel = dVals.length ? dLabels[Math.round(dVals.reduce((a,b)=>a+b,0)/dVals.length)] : '—';

  document.getElementById('statsRow').innerHTML = `
    <div class="stat-card"><div class="stat-num">${total}</div><div class="stat-label">Total Responses</div></div>
    <div class="stat-card"><div class="stat-num">${cities}</div><div class="stat-label">Different Cities</div></div>
    <div class="stat-card"><div class="stat-num">${today}</div><div class="stat-label">Today</div></div>
    <div class="stat-card"><div class="stat-num">${avgDLabel}</div><div class="stat-label">Avg Discomfort Level</div></div>
  `;
}

function renderTable() {
  if (filteredData.length === 0) { document.getElementById('tableBody').innerHTML = '<tr><td colspan="99" style="text-align:center;padding:40px;color:var(--text-dim)">No matching responses</td></tr>'; return; }

  const cols = ['#', 'Timestamp', 'Name', 'Contact', 'City', 'Experience', 'Saddle Type', 'Discomfort', 'Biggest Problem'];
  document.getElementById('tableHead').innerHTML = '<tr>' + cols.map(c => `<th>${c}</th>`).join('') + '<th></th></tr>';

  document.getElementById('tableBody').innerHTML = filteredData.map((row, i) => {
    const idx = allData.indexOf(row) + 1;
    return `<tr style="cursor:pointer" onclick="showDetail(${allData.indexOf(row)})">
      <td>${idx}</td>
      <td>${row.Timestamp || '—'}</td>
      <td><strong>${row.Name || '—'}</strong></td>
      <td>${row.Contact || '—'}</td>
      <td>${row.City || '—'}</td>
      <td>${row.Experience || '—'}</td>
      <td>${row['Saddle Type'] || '—'}</td>
      <td>${row.Discomfort || '—'}</td>
      <td class="wrap">${(row['Biggest Problem'] || '—').substring(0, 80)}${(row['Biggest Problem']||'').length > 80 ? '...' : ''}</td>
      <td><button class="btn btn-outline" style="padding:6px 12px;font-size:12px" onclick="event.stopPropagation();deleteRow(${allData.indexOf(row)})">🗑</button></td>
    </tr>`;
  }).join('');

  document.getElementById('countLabel').textContent = `${filteredData.length} of ${allData.length} shown`;
}

function renderCharts() {
  let html = '';

  // Single-value charts
  for (const [field, title] of Object.entries(CHART_FIELDS)) {
    const counts = {};
    allData.forEach(d => { const v = d[field]; if (v) counts[v] = (counts[v]||0) + 1; });
    html += buildBarChart(title, counts);
  }

  // Multi-value charts (semicolon separated)
  for (const [field, title] of Object.entries(MULTI_CHART_FIELDS)) {
    const counts = {};
    allData.forEach(d => {
      const v = d[field];
      if (v) v.split('; ').forEach(item => { counts[item.trim()] = (counts[item.trim()]||0) + 1; });
    });
    html += buildBarChart(title, counts);
  }

  document.getElementById('chartsGrid').innerHTML = html;
}

function buildBarChart(title, counts) {
  const sorted = Object.entries(counts).sort((a,b) => b[1] - a[1]);
  const max = sorted.length ? sorted[0][1] : 1;
  let bars = '';
  sorted.forEach(([label, count], i) => {
    const pct = Math.round((count / max) * 100);
    const color = COLORS[i % COLORS.length];
    bars += `<div class="bar-row">
      <span class="bar-label">${label}</span>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${color}">${count}</div></div>
    </div>`;
  });
  return `<div class="chart-card"><h3>${title}</h3>${bars || '<p style="color:var(--text-dim);font-size:13px">No data</p>'}</div>`;
}

function showDetail(idx) {
  const row = allData[idx];
  let html = `<h2>Response #${idx+1} <button class="modal-close" onclick="closeModal()">✕</button></h2>`;
  for (const [key, val] of Object.entries(row)) {
    html += `<div class="modal-row"><div class="modal-key">${key}</div><div class="modal-val">${val || '—'}</div></div>`;
  }
  document.getElementById('modalContent').innerHTML = html;
  document.getElementById('modalOverlay').classList.add('active');
}
function closeModal() { document.getElementById('modalOverlay').classList.remove('active'); }

function filterTable(q) {
  q = q.toLowerCase();
  filteredData = allData.filter(d => Object.values(d).some(v => (v||'').toLowerCase().includes(q)));
  renderTable();
}

function deleteRow(idx) {
  if (!confirm('Yeh response delete karein?')) return;
  allData.splice(idx, 1);
  localStorage.setItem('saddle_survey_responses', JSON.stringify(allData));
  filteredData = [...allData];
  document.getElementById('searchInput').value = '';
  render();
}

function clearAll() {
  if (!confirm('⚠ Sab responses delete ho jayein gi! Pehle Export CSV kar lein. Continue?')) return;
  localStorage.removeItem('saddle_survey_responses');
  allData = []; filteredData = [];
  render();
}

function exportCSV() {
  if (allData.length === 0) { alert('Koi data nahi hai export karne ke liye.'); return; }
  const headers = Object.keys(allData[0]);
  const csv = [
    headers.map(h => `"${h}"`).join(','),
    ...allData.map(row => headers.map(h => `"${(row[h]||'').replace(/"/g, '""')}"`).join(','))
  ].join('\n');
  const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = `saddle_survey_${new Date().toISOString().slice(0,10)}.csv`;
  link.click();
}

function importCSV() { document.getElementById('csvFileInput').click(); }

function handleCSVImport(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const text = e.target.result;
      const lines = text.split('\n').filter(l => l.trim());
      if (lines.length < 2) { alert('CSV mein data nahi hai.'); return; }
      const headers = parseCSVLine(lines[0]);
      const imported = [];
      for (let i = 1; i < lines.length; i++) {
        const vals = parseCSVLine(lines[i]);
        const row = {};
        headers.forEach((h, j) => { row[h] = vals[j] || ''; });
        imported.push(row);
      }
      allData = allData.concat(imported);
      localStorage.setItem('saddle_survey_responses', JSON.stringify(allData));
      filteredData = [...allData];
      render();
      alert(`✅ ${imported.length} responses imported!`);
    } catch (err) { alert('CSV parse error: ' + err.message); }
  };
  reader.readAsText(file);
  event.target.value = '';
}

function parseCSVLine(line) {
  const result = []; let current = ''; let inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (inQuotes) {
      if (ch === '"') { if (line[i+1] === '"') { current += '"'; i++; } else { inQuotes = false; } }
      else { current += ch; }
    } else {
      if (ch === '"') { inQuotes = true; }
      else if (ch === ',') { result.push(current.trim()); current = ''; }
      else { current += ch; }
    }
  }
  result.push(current.trim());
  return result;
}

function switchTab(tab, el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('tableView').style.display = tab === 'table' ? 'block' : 'none';
  document.getElementById('chartsView').style.display = tab === 'charts' ? 'block' : 'none';
}

async function syncWithGoogleSheet() {
  if (!GOOGLE_SHEET_URL) return;
  const btn = document.getElementById('syncBtn');
  if (btn) btn.textContent = '⏳ Fetching...';
  try {
    const res = await fetch(GOOGLE_SHEET_URL);
    const json = await res.json();
    if (Array.isArray(json) && json.length > 0) {
      allData = json;
      localStorage.setItem('saddle_survey_responses', JSON.stringify(allData));
      filteredData = [...allData];
      render();
    }
  } catch (err) {
    console.log('Sheet sync fetch error:', err);
  } finally {
    if (btn) btn.textContent = '🔄 Refresh from Sheet';
  }
}

// Boot
loadData();
syncWithGoogleSheet();

// Auto-sync every 15 seconds
setInterval(syncWithGoogleSheet, 15000);
</script>
</body>
</html>
